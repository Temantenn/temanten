name: Deploy ke cPanel Otomatis

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
    - name: 🚚 Mengambil kode terbaru
      uses: actions/checkout@v4

    - name: 🚀 Upload ke cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /home/polkppfc/temanten.polka.biz.id/
        protocol: ftps
        security: loose
        port: 21
        exclude: |
          **/.git*
          **/node_modules/**
          .env
          storage/framework/cache/**
          storage/framework/sessions/**
          storage/framework/views/**
          storage/logs/**
          storage/app/private/**
          bootstrap/cache/**

    - name: 🧹 Clear Laravel caches via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd /home/polkppfc/temanten.polka.biz.id/
          php artisan view:clear
          php artisan cache:clear
          php artisan config:clear
          php artisan route:clear
          php artisan optimize
      if: always() && hashFiles('.github/workflows/deploy.yml') != ''
