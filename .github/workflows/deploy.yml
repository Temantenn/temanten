name: Deploy ke cPanel Otomatis

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
    - name: 🚚 Mengambil kode terbaru
      uses: actions/checkout@v4

    - name: 🚀 Upload ke cPanel via FTPS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /home/polkppfc/temanten.polka.biz.id/public/
        protocol: ftps
        security: loose # Penting untuk hosting yang sertifikat SSL-nya tidak standar
        port: 21
