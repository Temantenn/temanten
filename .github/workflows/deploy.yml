name: Deploy ke cPanel Otomatis

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Checkout kode terbaru
      uses: actions/checkout@v4

    - name: 📦 Setup Node + install deps
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 🔨 Build Vite assets (Alpine.js + theme CSS bundles)
      run: |
        npm ci --no-audit --no-fund
        npm run build
        echo "[OK] Vite build done — public/build/ populated"

    - name: 🚀 Upload via rsync (direct on runner)
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USERNAME }}
        SSH_PORT: ${{ secrets.SSH_PORT }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" 2>/dev/null >> ~/.ssh/known_hosts
        rsync -rlgoDzvc -i \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='/storage/framework/cache' \
          --exclude='/storage/framework/sessions' \
          --exclude='/storage/framework/views' \
          --exclude='/storage/logs' \
          --exclude='/storage/app/private' \
          --exclude='/.env' \
          -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
          ./ "$SSH_USER@$SSH_HOST:/home/polkppfc/temanten.polka.biz.id/"
        echo "[OK] rsync upload done"

    - name: 🔧 Fix deploy + composer install + cache clear
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          set -e
          APP=/home/polkppfc/temanten.polka.biz.id
          cd $APP
          echo "=== DIAGNOSTIC: Check current storage state ==="
          ls -la public/ | grep storage || echo "No storage link/dir in public/"
          ls -la storage/app/public/ 2>/dev/null | head -5 || echo "storage/app/public not found"
          echo "=== Force recreate storage symlink ==="
          rm -rf public/storage
          php artisan storage:link --force || php artisan storage:link
          ls -la public/storage
          echo "=== Fix storage permissions (comprehensive) ==="
          chmod -R 755 storage/app/public 2>/dev/null || true
          find storage/app/public -type f -exec chmod 644 {} \; 2>/dev/null || true
          # Try to set ownership to web server user (common cPanel users)
          chown -R polkppfc:polkppfc storage/app/public 2>/dev/null || true
          chown -R polkppfc:nobody storage/app/public 2>/dev/null || true
          echo "[OK] Permissions and ownership fixed"
          echo "=== Verify symlink target ==="
          readlink -f public/storage
          ls -la $(readlink -f public/storage) 2>/dev/null | head -5 || echo "Symlink target not accessible"
          echo "=== Fix phantom path (dari deploy lama) ==="
          PHANTOM="$APP/home/polkppfc/temanten.polka.biz.id"
          if [ -d "$PHANTOM" ]; then
            rsync -a "$PHANTOM/" $APP/
            rm -rf $APP/home
            echo "[OK] Phantom path moved to addon root"
          else
            echo "[SKIP] No phantom path"
          fi
          echo "=== Composer install (force regen installed.json to fix Landmine 10) ==="
          cd $APP
          rm -f vendor/composer/installed.json vendor/composer/installed.php bootstrap/cache/packages.php
          php -d memory_limit=512M composer.phar install --no-dev --no-scripts --no-progress || true
          php composer.phar dump-autoload --no-dev -o || true
          rm -f bootstrap/cache/packages.php
          php artisan package:discover --ansi || true
          echo "=== Verify boost removed from installed.json ==="
          grep -c "laravel/boost" vendor/composer/installed.json || echo "0 (good - boost not in installed.json)"
          echo "=== Run pending migrations (idempotent, safe) ==="
          php artisan migrate --force
          echo "=== Reset admin password ==="
          php artisan admin:reset-password || true
          echo "=== Laravel cache clear ==="
          php artisan view:clear || true
          php artisan cache:clear || true
          php artisan config:clear || true
          php artisan route:clear || true
          php artisan optimize || true
          echo "=== TEST: Verify storage access ==="
          # List any invitation files that exist
          find storage/app/public/invitations -type f 2>/dev/null | head -5 || echo "No invitation files found"
          # Test access via symlink
          FIRST_FILE=$(find storage/app/public/invitations -type f 2>/dev/null | head -1)
          if [ -n "$FIRST_FILE" ]; then
            RELATIVE_PATH=${FIRST_FILE#storage/app/public/}
            echo "Testing: public/storage/$RELATIVE_PATH"
            ls -la "public/storage/$RELATIVE_PATH" 2>/dev/null && echo "✓ File accessible via symlink" || echo "✗ File NOT accessible via symlink"
            # Test via curl
            curl -sI "http://localhost/storage/$RELATIVE_PATH" 2>/dev/null | head -3 || echo "curl test skipped"
          fi
          echo "=== Check .htaccess in public/storage ==="
          cat public/storage/.htaccess 2>/dev/null || echo "No .htaccess in storage (good)"
          echo "=== Check if cPanel has hotlink protection ==="
          cat public/.htaccess 2>/dev/null | grep -i "storage\|hotlink\|deny" || echo "No storage-related rules in public/.htaccess"
