name: Deploy ke cPanel Otomatis

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
    - name: 🚚 Mengambil kode terbaru
      uses: actions/checkout@v4

    - name: 🚀 Upload ke cPanel (via SSH rsync)
      uses: easingthemes/ssh-deploy@v4.1.7
      with:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        SSH_KEY: ${{ secrets.SSH_KEY }}
        SSH_PORT: ${{ secrets.SSH_PORT }}
        SOURCE: .
        TARGET: /home/polkppfc/temanten.polka.biz.id/
        EXCLUDE: "/.git, /node_modules, /storage/framework/cache, /storage/framework/sessions, /storage/framework/views, /storage/logs, /storage/app/private, /bootstrap/cache, /.env"
        SCRIPT_AFTER: |
          cd /home/polkppfc/temanten.polka.biz.id/
          php artisan view:clear || true
          php artisan cache:clear || true
          php artisan config:clear || true
          php artisan route:clear || true
          php artisan optimize || true

    - name: 🧹 Clear Laravel caches via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd /home/polkppfc/temanten.polka.biz.id/
          php artisan view:clear
          php artisan cache:clear
          php artisan config:clear
          php artisan route:clear
          php artisan optimize
      if: always() && hashFiles('.github/workflows/deploy.yml') != ''
